name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const changes = additions + deletions;

            let label = '';
            if (changes < 100) label = 'size/XS';
            else if (changes < 300) label = 'size/S';
            else if (changes < 600) label = 'size/M';
            else if (changes < 1000) label = 'size/L';
            else label = 'size/XL';

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [label]
              });
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Unable to add PR size label "${label}" because this workflow token does not have label write permission.`);
              } else {
                throw error;
              }
            }

            if (changes > 1000) {
              core.warning('This PR is very large. Consider breaking it into smaller PRs.');
            }

  bundle-size-comment:
    name: Bundle Size Delta Comment
    runs-on: ubuntu-latest
    # Only run when the CI workflow has already produced a bundle-size-report artifact.
    # We use `workflow_run` trigger for cross-workflow artifact access; here we use
    # a conditional download approach for simplicity.
    permissions:
      pull-requests: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Download bundle size report (current PR)
        uses: actions/github-script@v7
        id: download_report
        with:
          script: |
            // Find the most recent workflow run for this PR's head SHA
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'pull_request',
              head_sha: context.payload.pull_request.head.sha,
              per_page: 5,
            });

            // Look for a bundle-size-report artifact
            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              const artifact = artifacts.data.artifacts.find(a => a.name === 'bundle-size-report');
              if (artifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                const fs = require('fs');
                fs.writeFileSync('/tmp/bundle-report.zip', Buffer.from(download.data));
                core.setOutput('found', 'true');
                return;
              }
            }
            core.setOutput('found', 'false');

      - name: Unzip bundle size report
        if: steps.download_report.outputs.found == 'true'
        run: |
          cd /tmp && unzip -o bundle-report.zip -d bundle-report || true

      - name: Post size table as PR comment
        if: steps.download_report.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportPath = '/tmp/bundle-report/.bundle-size-baseline.json';
            if (!fs.existsSync(reportPath)) {
              console.log('No baseline JSON found in artifact — skipping comment.');
              return;
            }

            const current = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const BUDGET_KB = 200;
            const EFFECTIVE_BUDGET_KB = 220; // 200 * 1.1 grace

            const rows = Object.entries(current).map(([route, kb]) => {
              const status = kb > EFFECTIVE_BUDGET_KB ? '❌' : kb > BUDGET_KB ? '⚠️' : '✅';
              return `| \`${route}\` | ${Number(kb).toFixed(1)} KB | ${status} |`;
            });

            const overBudget = Object.entries(current).filter(([, kb]) => kb > EFFECTIVE_BUDGET_KB);

            const body = [
              '## 📦 Bundle Size Report',
              '',
              `Budget: **${BUDGET_KB} KB** · Effective (with +10% grace): **${EFFECTIVE_BUDGET_KB} KB**`,
              '',
              '| Route | First Load JS | Status |',
              '|-------|--------------|--------|',
              ...rows,
              '',
              overBudget.length > 0
                ? `> **${overBudget.length} route(s) exceed the effective budget.** See [docs/architecture/frontend-perf.md](../docs/architecture/frontend-perf.md) and the [budget-bump procedure](../apps/frontend/scripts/check-perf-budget.mjs) to investigate.`
                : '> All routes are within budget ✅',
              '',
              '_Generated by the bundle-size-comment job — values from the CI build of this PR._',
            ].join('\n');

            // Upsert the comment (find existing bot comment and update it).
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes('## 📦 Bundle Size Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  ui-coverage-comment:
    name: packages/ui Coverage Comment
    runs-on: ubuntu-latest
    # Only run when this PR touches packages/ui, and only after the CI
    # workflow has produced a ui-coverage-report artifact for this SHA.
    permissions:
      pull-requests: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this PR touches packages/ui
        id: touches_ui
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^packages/ui/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download packages/ui coverage report (current PR)
        if: steps.touches_ui.outputs.changed == 'true'
        uses: actions/github-script@v7
        id: download_report
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event: 'pull_request',
              head_sha: context.payload.pull_request.head.sha,
              per_page: 5,
            });

            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              const artifact = artifacts.data.artifacts.find(a => a.name === 'ui-coverage-report');
              if (artifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                const fs = require('fs');
                fs.writeFileSync('/tmp/ui-coverage-report.zip', Buffer.from(download.data));
                core.setOutput('found', 'true');
                return;
              }
            }
            core.setOutput('found', 'false');

      - name: Unzip coverage report
        if: steps.touches_ui.outputs.changed == 'true' && steps.download_report.outputs.found == 'true'
        run: |
          cd /tmp && unzip -o ui-coverage-report.zip -d ui-coverage-report || true

      - name: Post coverage table as PR comment
        if: steps.touches_ui.outputs.changed == 'true' && steps.download_report.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const reportPath = '/tmp/ui-coverage-report/coverage-summary.json';
            if (!fs.existsSync(reportPath)) {
              console.log('No coverage-summary.json found in artifact — skipping comment.');
              return;
            }

            const summary = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const total = summary.total;
            const THRESHOLD = 90;

            const metricRow = (name, metric) => {
              const status = metric.pct >= THRESHOLD ? '✅' : '❌';
              return `| ${name} | ${metric.covered}/${metric.total} | ${metric.pct.toFixed(2)}% | ${status} |`;
            };

            const fileRows = Object.entries(summary)
              .filter(([key]) => key !== 'total')
              .map(([file, metrics]) => {
                const shortName = file.split('/src/')[1] ?? file;
                const status = metrics.lines.pct >= THRESHOLD ? '✅' : '❌';
                return `| \`${shortName}\` | ${metrics.lines.pct.toFixed(1)}% | ${metrics.branches.pct.toFixed(1)}% | ${metrics.functions.pct.toFixed(1)}% | ${status} |`;
              });

            const body = [
              '## 🧪 packages/ui Coverage Report',
              '',
              `Gate: **${THRESHOLD}%** lines/branches/functions`,
              '',
              '### Overall',
              '| Metric | Covered/Total | % | Status |',
              '|--------|---------------|---|--------|',
              metricRow('Lines', total.lines),
              metricRow('Branches', total.branches),
              metricRow('Functions', total.functions),
              '',
              '### Per file',
              '| File | Lines | Branches | Functions | Status |',
              '|------|-------|----------|-----------|--------|',
              ...fileRows,
              '',
              '_Generated by the ui-coverage-comment job — values from the CI test run of this PR. See `packages/ui/vitest.config.ts` for the gate configuration._',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.data.find(
              c => c.user.type === 'Bot' && c.body.includes('## 🧪 packages/ui Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

